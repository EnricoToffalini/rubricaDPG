project:
  type: website
  output-dir: docs
  post-render: versioni.lua
  render:
    - index.qmd
  resources:
    - ricerca.js
    - logo/scarabocchio.svg
    - logo/social-preview.png

website:
  favicon: logo/scarabocchio.svg
  title: "Rubrica DPG"
  search: false

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
    # og:description e twitter:description: Quarto li riscrive con il description di index.qmd
    include-in-header:
      text: |
        <meta property="og:type" content="website">
        <meta property="og:locale" content="it_IT">
        <meta property="og:site_name" content="Rubrica DPG">
        <meta property="og:title" content="Rubrica DPG">
        <meta property="og:description" content="Link operativi e contatti per chi lavora al Dipartimento di Psicologia Generale dell’Università di Padova.">
        <meta property="og:url" content="https://enricotoffalini.github.io/rubricaDPG/">
        <meta property="og:image" content="https://enricotoffalini.github.io/rubricaDPG/logo/social-preview.png">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Rubrica DPG: titolo su fondo rosso, una ricerca di esempio «rimborso missione» con i risultati e le categorie della rubrica">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Rubrica DPG">
        <meta name="twitter:description" content="Link operativi e contatti per chi lavora al Dipartimento di Psicologia Generale dell’Università di Padova.">
